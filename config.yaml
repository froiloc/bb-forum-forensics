  # Beleg: management/migration_fleet/migration_fleet_admin.py, Z. 78-94
  #backup_dir: "./backups/migration/"

# =============================================================================
# Datenbank-Journalmodus (NEU Build 408).
#
# Belegte Ausgangslage (Diagnose 2026-07-14, Testsystem auf UNC-Share
# \\KK31Storage15\Volume 1\..., von Windows als DriveType=4 REMOTE gemeldet):
#   PRAGMA journal_mode=WAL  -> sqlite3.OperationalError: disk I/O error
#   PRAGMA journal_mode=DELETE / TRUNCATE -> OK (Schreiben + Ruecklesen belegt)
# Ursache: WAL haelt seinen wal-index in Shared Memory ('-shm', per mmap im
# DB-Verzeichnis). Shared Memory ist maschinenlokal, daher unterstuetzt SQLite
# WAL auf Netzwerk-Dateisystemen ausdruecklich nicht (sqlite.org/wal.html).
#
# WAL-VERBOT (Build 499, mc 2026-07-22 — PROD-Vorfall Citrix):
#   WAL wird projektweit NICHT MEHR verwendet. 'wal' ist als Wert VERBOTEN und
#   fuehrt zum harten Startabbruch mit Klartext. Grund: In der PROD-Citrix-
#   Umgebung tarnt sich das geteilte Laufwerk als lokale Platte; ein WAL-Stempel
#   macht die Datei dort unbrauchbar ('database disk image is malformed'),
#   sobald eine zweite Maschine die -shm/-wal sperrt. Die Laufwerksart ist dort
#   nicht verlaesslich erkennbar — deshalb das generelle Verbot statt Heuristik.
#
# journal_mode (zulaessig: auto | delete | truncate | persist — 'wal' VERBOTEN):
#   auto      (Default) — seit Build 499: setzt DIREKT journal_mode_fallback
#                         (kein WAL-Versuch mehr).
#   delete    — Rollback-Journal (Empfehlung, hier gesetzt).
#   truncate  — wie delete, spart Verzeichnis-I/O beim Journal-Loeschen.
#   persist   — wie delete, Journaldatei bleibt liegen.
#
# ACHTUNG: Diese Weiche steuert NUR, was der Server neu setzt. Bereits
# WAL-GESTEMPELTE Bestands-DBs (Header-Byte 18/19 == 2) sind auf einem
# Netzlaufwerk auch LESEND nicht zu oeffnen und muessen einmalig umgestempelt
# werden:  python tools/convert_journal_mode.py --data-dir ./data --to delete
# =============================================================================
db:
  # Build 499: hart 'delete' (nicht 'auto') — doppelt abgesichert. Selbst wenn
  # jemand hier 'auto' setzt, versucht der Code seit Build 499 kein WAL mehr.
  journal_mode:          "delete"
  journal_mode_fallback: "delete"

# =============================================================================
# Backup (Welle 0, Build 352 ff.). Sicherung ALLER Datenbanken per
# transaktionalem SQLite-Snapshot ('VACUUM INTO'): das erzeugt eine saubere,
# WAL-unabhaengige Kopie und veraendert die Quelle NICHT (Beleg: Bauplan B7 §11;
# Datenmigrationsleitfaden v0.2 §4). NIE 'wal_checkpoint(TRUNCATE)' im Backup-
# Pfad. Diese Sektion deckt Ziel und Rahmenbedingungen ab; das eigentliche
# Schreiben erfolgt im Executor (Build 353), die Registrierung in Build 354.
# =============================================================================
backup:
  # Zielverzeichnis fuer die Backup-Dateien. Prod: UNC/SMB-Pfad auf dem
  # Backup-Ziel, z.B. "\\\\prod01\\dfs\\backups\\". Das Verzeichnis (oder sein
  # Elternverzeichnis) muss erreichbar sein; die Vorabpruefung meldet sonst
  # einen klaren Fehler, bevor irgendetwas geschrieben wird.
  #dest_dir: "./backups/"
  dest_dir: "/media/paul/3rd/aiw/backups/"

  # Aufbewahrung: wie viele Backup-GENERATIONEN je Datenbank behalten werden.
  # Aeltere Generationen werden erst vom Executor (Build 353) beschnitten.
  retention_count: 7

  # Speicherplatz-Vorabpruefung (vorfall-getrieben: 'default.db'-Malformed durch
  # volle Platte am 2026-07-01). Vor dem Backup muss am Ziel mindestens
  # (min_free_factor * Gesamtgroesse aller Quell-DBs) frei sein. Der Faktor > 1
  # gibt Reserve fuer temporaeren VACUUM-Overhead und Dateisystem-Verschnitt.
  min_free_factor: 1.3

  # WAL-Behandlung vor dem Snapshot: "passive" fuehrt ein nicht-blockierendes
  # 'wal_checkpoint(PASSIVE)' aus (trimmt WAL, ohne Schreiber zu stoeren);
  # "none" ueberspringt das. NIEMALS "truncate" (blockiert/gefaehrdet Live).
  checkpoint: "passive"

  # Ob die gemeinsam genutzten/Referenz-Datenbanken mitgesichert werden:
  # default.db und templates.db (koennen wachsen) sowie translations.db
  # (KI-Uebersetzungen, aendert sich kaum, soll aber mindestens einmal gesichert
  # sein). true = mitsichern (empfohlen). Die fallbezogenen Ermittler-DBs
  # (coordinator, evidence/forensic/assets je uid) werden IMMER gesichert.
  include_shared_dbs: true

# =============================================================================
# Formatregeln fuer Berichts-Eingabefelder (Build 388).
#
# Ein Baustein verweist symbolisch auf eine Regel, z. B.:
#   {{m:spurennummer||Spurennummer der Vorgangsverwaltung|rule:spurennummer}}
#
# Ein NEUES Spurennummern-Format wird hier aufgenommen — ohne Code-Aenderung
# und ohne Aenderung an templates.db. Nach der Aenderung: Server neu starten.
#
# Felder je Regel:
#   pattern    Regulaerer Ausdruck. MUSS in Python UND JavaScript dieselbe
#              Bedeutung haben (keine Lookbehinds, keine benannten Gruppen) —
#              geprueft wird sowohl im Browser als auch beim Einreichen auf
#              dem Server.
#   transform  Normalisierung VOR der Pruefung: upper | lower | strip | none.
#              Der normalisierte Wert ist auch der GESPEICHERTE Wert.
#   hint       Klartext-Hinweis, der dem Ermittler bei Fehleingabe angezeigt
#              wird. Ohne hint sieht er nur die Regex — das ist unzumutbar.
#
# Beleg: Entwicklervorgabe Projektgespraech 2026-07-12
# =============================================================================
validation:
  rules:
    spurennummer:
      pattern:   "^(AIW|R3X|FBL|AMZ|BRU)\\d+$"
      transform: "upper"
      hint:      "Behoerdenkuerzel (AIW, R3X, FBL, AMZ oder BRU) gefolgt von Ziffern, z. B. AIW12345"

# =============================================================================
# Active Directory (Build 501, Bauplan Build501_502 §2).
#
# ad.ldap.* — die vier Verbindungsparameter des AD-Abgleichs. Sie ersetzen die
# .env-Variablen des in der PROD-Umgebung verifizierten PoC 'get-members4.py'
# (Zuordnung PoC -> config: DOMAIN_DNS_NAME -> domain_dns_name,
# LDAP_BASE_DN -> base_dn, LDAP_USER_BASE -> user_base,
# TARGET_GROUP_NAME -> target_group).
#
# Die echten Dienst-Werte werden NICHT eingecheckt, sondern durch die
# Administration in der VM eingetragen. LEERE Werte => der AD-Abgleich bricht
# mit einem klaren Konfigurationsfehler ab (DEFAULT-DENY, kein stilles
# Ueberspringen — Grundregel 1).
#
# Authentifizierung: Kerberos/SSPI der angemeldeten Windows-Sitzung (wie PoC);
# es werden KEINE Zugangsdaten in der Konfiguration hinterlegt.
#
# In dieser Sektion wohnt ausserdem die Empfaenger-Allowlist der externen
# Fallfreigabe (ad.release_recipients / ad.release_group, Build 462) — sie
# bleibt unveraendert und ist hier bewusst nicht vorbelegt (Default-Deny).
# =============================================================================
ad:
  ldap:
    domain_dns_name: ""   # DNS-Name der AD-Domaene, z. B. "polizei.example.nrw"
    base_dn: ""           # Suchbasis der Gruppenaufloesung, z. B. "DC=polizei,DC=example,DC=nrw"
    user_base: ""         # Suchbasis der Benutzeraufloesung (OU der Konten)
    target_group: ""      # AD-Gruppe der Ermittler:innen (cn), rekursiv aufgeloest

# =============================================================================
# Wartungsmodus (NEU Build 638, Ticket 15429c75).
#
# Diese Sektion versorgt die beiden Wartungswerkzeuge
#   tools/maintenance.py       (enter | exit | status)
#   tools/maintenance_kill.py
# mit Vorgabewerten für den STANDORT. Sie ist vollständig OPTIONAL: Was hier
# nicht steht, bleibt beim festen Vorgabewert des Werkzeugs (in Klammern).
#
# Vorrang — projektweit gültig und ab Build 638 auch in diesen beiden
# Werkzeugen tatsächlich umgesetzt:
#
#   Argument  >  aus einem Argument abgeleitet  >  config.yaml  >  Vorgabewert
#
# Jeder Aufruf gibt aus, welcher Wert aus welcher Quelle stammt ('[Konfig] ...').
# Wer wissen will, ob ein Eintrag hier greift, sieht es in der ersten Zeile
# der Ausgabe — nicht erst am Verhalten.
#
# WARUM DIE SEKTION AUSKOMMENTIERT IST: Ein eingetragener Wert gilt als
# Standort-Festlegung und schlägt den Vorgabewert des Werkzeugs. Solange
# nichts eingetragen ist, verhalten sich die Werkzeuge exakt wie bis Build 637.
#
# maintenance:
#   # Datenverzeichnis mit _maintenance/ und den Datenbanken (./data).
#   # Wird auch verwendet, wenn weder --data-dir noch --coordinator-db fällt.
#   data_dir: "./data"
#
#   # Sekunden, ab denen ein Präsenz-Beacon als veraltet gilt (30). Ein Server,
#   # dessen Beacon älter ist, wird als 'vermutlich tot, unbestätigt' geführt —
#   # NIE als 'in Ordnung'. Auf einem trägen Netzlaufwerk eher erhöhen: ein zu
#   # knapper Wert erklärt lebende Server für tot.
#   stale_seconds: 30
#
#   # Verhalten laufender Normalserver beim Setzen des Fensters: pause | beenden
#   # ('pause'). Ein anderer Wert wird beim Aufruf mit Klartext abgewiesen.
#   on_active: "pause"
#
#   # Versions-Wächter: Server mit kleinerer Buildnummer beenden sich beim
#   # Wiederaufnehmen selbst (0 = keine Anforderung).
#   min_build: 0
#
#   # Automatischer Ablauf des Wartungsfensters in Minuten (0 = nie). Als
#   # Standort-Vorgabe sinnvoll: ein vergessenes Fenster hält sonst den
#   # Betrieb an, bis es jemand bemerkt.
#   ablauf_min: 0
#
#   # Maximale Wartezeit auf ACKs und den Exklusiv-Lock-Beweis in Sekunden (60).
#   wait_timeout_seconds: 60
#
#   # Abstand zweier Prüfungen in der Warteschleife in Sekunden (1.0). Das
#   # Werkzeug begrenzt den wirksamen Wert selbst auf 0,2 bis 2,0 Sekunden.
#   poll_seconds: 1.0
#
#   # tools/maintenance_kill.py: Wartezeit auf das Selbstbeenden in Sekunden (30).
#   kill_wait_timeout_seconds: 30
#
#   # ------------------------------------------------------------------------
#   # NACHTRAG BUILD 640 — KORREKTUR AM EIGENEN BLOCK VON BUILD 638.
#   #
#   # Die beiden folgenden Einträge werden vom SERVER (main.py) gelesen und
#   # existierten schon vor Build 638. Der Block oben ist in Build 638
#   # geschrieben worden, ohne sie zu nennen — er belegte damit den Namensraum
#   # 'maintenance' und sah aus, als beschreibe er ihn vollständig. Wer den
#   # Abschnitt einkommentiert und die beiden vergisst, ändert nichts (die
#   # Vorgabewerte im Code greifen weiter), aber er hätte es nicht wissen
#   # können. Die Lücke ist bei der Erhebung zu Ticket 60e4236e aufgefallen.
#   #
#   # Sie gehören NICHT zu den Wartungswerkzeugen, sondern zum Verhalten des
#   # laufenden Servers, wenn ein Wartungsfenster gesetzt wird.
#   # ------------------------------------------------------------------------
#
#   # Wie lange der Server beim Ruhigstellen auf das Auslaufen offener
#   # Anfragen wartet, bevor er bestätigt (30 Sekunden).
#   # Beleg: main.py, _QUIESCE_DRAIN_TIMEOUT_S
#   drain_timeout_sec: 30
#
#   # In welchem Abstand der laufende Server nachsieht, ob ein Wartungsfenster
#   # gesetzt oder aufgehoben wurde (3 Sekunden).
#   # Beleg: main.py, _MAINT_POLL_SEC
#   poll_interval_sec: 3
# =============================================================================

hosts_management:
  enabled: false

logging:
  level: "debug"
  logfile: "./logs/forensic_server.log"

dashboard:
  ampel:
    amber_idle_days: 7
    red_idle_days: 21

# =============================================================================
# SCHWELLENWERTE DER FALLSTEUERUNG (hier aufgenommen: Build 640).
#
# Befund aus der Erhebung zu Ticket 60e4236e: Die folgenden drei Abschnitte
# werden vom Code ausgewertet, standen aber in keiner ausgelieferten
# config.yaml und auch nicht in den Coded Defaults des ConfigLoaders. Ihre
# Vorgabewerte leben in den jeweiligen Datenklassen. Wer sie ändern wollte,
# musste sie im Quelltext finden.
#
# Alle drei sind AUSKOMMENTIERT aufgenommen — ein eingetragener Wert wäre eine
# fachliche Festlegung, die niemand bestellt hat. Ohne Eintrag gilt weiterhin
# genau das, was bisher galt.
#
# ALLE DREI SIND AUSFALLSICHER GEBAUT: Ein unlesbarer oder unsinniger Wert
# führt NICHT zum Abbruch, sondern still zurück auf die Vorgabe (jeweils
# 'except Exception: return d'). Das ist bei Schwellenwerten einer Anzeige
# vertretbar — es heißt aber auch, dass ein Tippfehler hier NICHT auffällt.
# Wer einen Wert setzt, prüft die Wirkung an der Sicht nach.
# =============================================================================

