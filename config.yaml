server:
  host: "127.0.0.2"
  port: 8080
  mode: "cli"

# Browser-Start (optional). Wird nur ausgewertet, wenn main.py mit
# --open-browser aufgerufen wird (z.B. durch start.bat / start.sh).
# Auflösungsreihenfolge: browser.path > portabler Browser > Auto-Erkennung
#                        > System-Standardbrowser.
# 'path' leer lassen für automatische Erkennung. Beispiele:
#   Windows: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
#   Linux:   "/usr/bin/google-chrome"
# Beleg: Projektgespräch 2026-06-24
browser:
  path: ""

paths:
  coordinator_db:  "./data/coordinator.db"
  forensic_db_dir: "./data/forensic/"
  default_db:      "./data/default.db"
  evidence_db_dir: "./data/evidence/"
  assets_db_dir:   "./data/assets/"    # NEU Build 017 — assets_<uid>.db liegt hier

hosts_management:
  enabled: false

logging:
  level: "debug"
  logfile: "./logs/forensic_server.log"

dashboard:
  ampel:
    amber_idle_days: 7
    red_idle_days: 21
