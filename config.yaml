server:
  host: "127.0.0.2"
  port: 8080
  mode: "cli"

# Browser-Start (optional). Wird nur ausgewertet, wenn main.py mit
# --open-browser aufgerufen wird (z.B. durch start.bat / start.sh).
# Auflösungsreihenfolge: browser.path > portabler Browser > Auto-Erkennung
#                        > System-Standardbrowser.
# 'path' leer lassen für automatische Erkennung. Beispiele:
#   Windows: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
#   Linux:   "/usr/bin/google-chrome"
# Beleg: Projektgespräch 2026-06-24
browser:
  path: ""

paths:
  coordinator_db:  "./data/coordinator.db"
  forensic_db_dir: "./data/forensic/"
  default_db:      "./data/default.db"
  evidence_db_dir: "./data/evidence/"
  assets_db_dir:   "./data/assets/"    # NEU Build 017 — assets_<uid>.db liegt hier
  templates_db:    "./data/templates.db"     # NEU Build 117 — Bug 3.3
  translations_db: "./data/translations.db"  # NEU Build 329 — KI-Uebersetzungen (read-only ATTACH)

# =============================================================================
# Datenbank-Journalmodus (NEU Build 408).
#
# Belegte Ausgangslage (Diagnose 2026-07-14, Testsystem auf UNC-Share
# \\KK31Storage15\Volume 1\..., von Windows als DriveType=4 REMOTE gemeldet):
#   PRAGMA journal_mode=WAL  -> sqlite3.OperationalError: disk I/O error
#   PRAGMA journal_mode=DELETE / TRUNCATE -> OK (Schreiben + Ruecklesen belegt)
# Ursache: WAL haelt seinen wal-index in Shared Memory ('-shm', per mmap im
# DB-Verzeichnis). Shared Memory ist maschinenlokal, daher unterstuetzt SQLite
# WAL auf Netzwerk-Dateisystemen ausdruecklich nicht (sqlite.org/wal.html).
#
# WAL-VERBOT (Build 499, mc 2026-07-22 — PROD-Vorfall Citrix):
#   WAL wird projektweit NICHT MEHR verwendet. 'wal' ist als Wert VERBOTEN und
#   fuehrt zum harten Startabbruch mit Klartext. Grund: In der PROD-Citrix-
#   Umgebung tarnt sich das geteilte Laufwerk als lokale Platte; ein WAL-Stempel
#   macht die Datei dort unbrauchbar ('database disk image is malformed'),
#   sobald eine zweite Maschine die -shm/-wal sperrt. Die Laufwerksart ist dort
#   nicht verlaesslich erkennbar — deshalb das generelle Verbot statt Heuristik.
#
# journal_mode (zulaessig: auto | delete | truncate | persist — 'wal' VERBOTEN):
#   auto      (Default) — seit Build 499: setzt DIREKT journal_mode_fallback
#                         (kein WAL-Versuch mehr).
#   delete    — Rollback-Journal (Empfehlung, hier gesetzt).
#   truncate  — wie delete, spart Verzeichnis-I/O beim Journal-Loeschen.
#   persist   — wie delete, Journaldatei bleibt liegen.
#
# ACHTUNG: Diese Weiche steuert NUR, was der Server neu setzt. Bereits
# WAL-GESTEMPELTE Bestands-DBs (Header-Byte 18/19 == 2) sind auf einem
# Netzlaufwerk auch LESEND nicht zu oeffnen und muessen einmalig umgestempelt
# werden:  python tools/convert_journal_mode.py --data-dir ./data --to delete
# =============================================================================
db:
  # Build 499: hart 'delete' (nicht 'auto') — doppelt abgesichert. Selbst wenn
  # jemand hier 'auto' setzt, versucht der Code seit Build 499 kein WAL mehr.
  journal_mode:          "delete"
  journal_mode_fallback: "delete"

# =============================================================================
# Backup (Welle 0, Build 352 ff.). Sicherung ALLER Datenbanken per
# transaktionalem SQLite-Snapshot ('VACUUM INTO'): das erzeugt eine saubere,
# WAL-unabhaengige Kopie und veraendert die Quelle NICHT (Beleg: Bauplan B7 §11;
# Datenmigrationsleitfaden v0.2 §4). NIE 'wal_checkpoint(TRUNCATE)' im Backup-
# Pfad. Diese Sektion deckt Ziel und Rahmenbedingungen ab; das eigentliche
# Schreiben erfolgt im Executor (Build 353), die Registrierung in Build 354.
# =============================================================================
backup:
  # Zielverzeichnis fuer die Backup-Dateien. Prod: UNC/SMB-Pfad auf dem
  # Backup-Ziel, z.B. "\\\\prod01\\dfs\\backups\\". Das Verzeichnis (oder sein
  # Elternverzeichnis) muss erreichbar sein; die Vorabpruefung meldet sonst
  # einen klaren Fehler, bevor irgendetwas geschrieben wird.
  dest_dir: "./backups/"

  # Aufbewahrung: wie viele Backup-GENERATIONEN je Datenbank behalten werden.
  # Aeltere Generationen werden erst vom Executor (Build 353) beschnitten.
  retention_count: 7

  # Speicherplatz-Vorabpruefung (vorfall-getrieben: 'default.db'-Malformed durch
  # volle Platte am 2026-07-01). Vor dem Backup muss am Ziel mindestens
  # (min_free_factor * Gesamtgroesse aller Quell-DBs) frei sein. Der Faktor > 1
  # gibt Reserve fuer temporaeren VACUUM-Overhead und Dateisystem-Verschnitt.
  min_free_factor: 1.3

  # WAL-Behandlung vor dem Snapshot: "passive" fuehrt ein nicht-blockierendes
  # 'wal_checkpoint(PASSIVE)' aus (trimmt WAL, ohne Schreiber zu stoeren);
  # "none" ueberspringt das. NIEMALS "truncate" (blockiert/gefaehrdet Live).
  checkpoint: "passive"

  # Ob die gemeinsam genutzten/Referenz-Datenbanken mitgesichert werden:
  # default.db und templates.db (koennen wachsen) sowie translations.db
  # (KI-Uebersetzungen, aendert sich kaum, soll aber mindestens einmal gesichert
  # sein). true = mitsichern (empfohlen). Die fallbezogenen Ermittler-DBs
  # (coordinator, evidence/forensic/assets je uid) werden IMMER gesichert.
  include_shared_dbs: true

# =============================================================================
# Formatregeln fuer Berichts-Eingabefelder (Build 388).
#
# Ein Baustein verweist symbolisch auf eine Regel, z. B.:
#   {{m:spurennummer||Spurennummer der Vorgangsverwaltung|rule:spurennummer}}
#
# Ein NEUES Spurennummern-Format wird hier aufgenommen — ohne Code-Aenderung
# und ohne Aenderung an templates.db. Nach der Aenderung: Server neu starten.
#
# Felder je Regel:
#   pattern    Regulaerer Ausdruck. MUSS in Python UND JavaScript dieselbe
#              Bedeutung haben (keine Lookbehinds, keine benannten Gruppen) —
#              geprueft wird sowohl im Browser als auch beim Einreichen auf
#              dem Server.
#   transform  Normalisierung VOR der Pruefung: upper | lower | strip | none.
#              Der normalisierte Wert ist auch der GESPEICHERTE Wert.
#   hint       Klartext-Hinweis, der dem Ermittler bei Fehleingabe angezeigt
#              wird. Ohne hint sieht er nur die Regex — das ist unzumutbar.
#
# Beleg: Entwicklervorgabe Projektgespraech 2026-07-12
# =============================================================================
validation:
  rules:
    spurennummer:
      pattern:   "^(AIW|R3X|FBL|AMZ|BRU)\\d+$"
      transform: "upper"
      hint:      "Behoerdenkuerzel (AIW, R3X, FBL, AMZ oder BRU) gefolgt von Ziffern, z. B. AIW12345"

hosts_management:
  enabled: false

logging:
  level: "debug"
  logfile: "./logs/forensic_server.log"

dashboard:
  ampel:
    amber_idle_days: 7
    red_idle_days: 21
