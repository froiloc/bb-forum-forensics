  templates_db:    "./data/templates.db"     # NEU Build 117 — Bug 3.3
  translations_db: "./data/translations.db"  # NEU Build 329 — KI-Uebersetzungen (read-only ATTACH)

  # --------------------------------------------------------------------------
  # WEITERE PFADE, die der Code liest — bis Build 640 hier NICHT genannt.
