<body data-autosave-debounce-ms="30000" data-subject="Rabenherz" data-user-id="2948078" data-username="paul" id="report-editor-body">
<!-- Fixierte Aktionsleiste (§4.2 Bauplan B6 v0.3) -->
<header id="report-action-bar">
<div id="report-action-bar-title">
        📄 Bericht · <span id="report-current-title">paul / Rabenherz (ID: 2948078)</span>
</div>
<!-- Bug 1.10 Fix Build 121: editor-report-title als div zwischen title und buttons.
           War bisher als span NACH den Buttons platziert und drückte die Leiste nach unten.
           Beleg: Bugfix Build 121, Projektgespraech 2026-05-08 -->
<div id="editor-report-title"></div>
<div id="report-action-bar-buttons">
<!-- Build 111: btn-new-report-header entfernt.
             "Neuer Bericht" befindet sich bereits im report-selector-container.
             Beleg: Projektgespraech 2026-05-07 -->
<!-- Bug 2.40/2.43 Absicherung Build 136: Manueller Speichern-Button.
             Wird aktiv sobald ein Bericht geladen ist (disabled -> enabled durch JS).
             Beleg: Bugfix Build 136, Projektgespraech 2026-05-09 -->
<button class="report-btn" disabled="" id="btn-save-now" title="Bericht jetzt speichern (Strg+S)">
          💾 Speichern
        </button>
<button class="report-btn" disabled="" id="btn-refresh-placeholders" title="Automatische Platzhalter aktualisieren">
          🔄 Aktualisieren
        </button>
<!-- Bug 1.9 Fix Build 121: ✎ → 🖶 (Drucker-Symbol).
             Beleg: Bugfix Build 121, Projektgespraech 2026-05-08 -->
<button class="report-btn" disabled="" id="btn-print" title="Bericht drucken">
          🖶 Drucken
        </button>
<div class="report-export-wrap">
<button class="report-btn" disabled="" id="btn-export" title="Bericht exportieren">
            ⬇ Export ▾
          </button>
<div class="report-export-dropdown" id="export-dropdown" style="display:none">
<button class="report-export-item" data-export-format="html">
              📄 HTML-Dokument
            </button>
<button class="report-export-item" data-export-format="docx">
              📝 Word-Dokument (.docx)
            </button>
<button class="report-export-item" data-export-format="sqlite">
              🗺 SQLite3-Fallakte (.db)
            </button>
</div>
</div>
<span class="report-lock-indicator report-lock-none" id="report-lock-indicator" title="Lock-Status">🔓</span>
<!-- Lock-Status: von userinfo.js beschrieben (Build 113) -->
<span class="lock-status lock-none" id="report-lock-status" style="font-size:11px" title="Editor-Lock-Status"></span>
<span class="save-indicator save-indicator--idle" id="editor-save-indicator" title="Kein Speichern ausstehend">🖫</span>
</div>
</header>
<!-- Zweispaltiger Arbeitsbereich (§4.1, §4.3, §4.7) -->
<div id="report-workspace">
<!-- Linke Spalte: Paragraph-Liste (~65%) -->
<main id="report-main-col">
<!-- Berichtsauswahl -->
<div id="report-selector-container"></div>
<!-- Status-Meldungen -->
<div id="report-status-msg"></div>
<!-- Editor-Bereich: EditorJS-Holder direkt in report-main-col.
             Beleg: Bauplan B6 §4.3, Build 113, Projektgespraech 2026-05-07 -->
<div class="editorjs-holder" id="editorjs-holder"></div>
<!-- Frozen-Overlay (BroadcastChannel-Schutz, §4.6) -->
<div id="report-frozen-overlay" style="display:none">
<div class="report-frozen-inner">
<strong>Dieser Editor ist bereits in einem anderen Fenster geöffnet.</strong><br/>
            Bitte wechseln Sie zum bestehenden Fenster.
            <br/><br/>
<button class="report-btn" id="btn-focus-existing">
              Zum bestehenden Fenster wechseln
            </button>
</div>
</div>
</main>
<!-- Schiebebalken zwischen main und aside (Bug 1.11 Fix) -->
<!-- Beleg: Projektgespraech 2026-05-11 -->
<div aria-hidden="true" id="col-resizer">
<div id="col-resizer-handle"></div>
</div>
<!-- Rechte Spalte: Support-Sidebar mit vierstufigem Akkordeon (~35%) -->
<!-- Beleg: Bauplan B6 v0.5 §4.4, Projektgespraech 2026-05-06 -->
<aside aria-label="Support-Sidebar" id="support-sidebar">
<!-- Abschnitt 1: Bausteine (Standard: aufgeklappt) -->
<section class="support-accordion-section support-accordion-section--open" data-accordion="blocks">
<button aria-controls="accordion-body-blocks" aria-expanded="true" class="support-accordion-toggle" type="button">
<span aria-hidden="true" class="support-accordion-icon">📦</span>
            Bausteine
            <span aria-hidden="true" class="support-accordion-chevron">▾</span>
</button>
<div aria-label="Bausteine" class="support-accordion-body" id="accordion-body-blocks" role="region">
<!-- Inhalt wird von module_panel.js/_refreshModulePanel() befuellt (Phase 7) -->
<!-- Beleg: Bauplan B6 v0.5 §4.4.1, Projektgespraech 2026-05-06 -->
<p class="support-accordion-empty" id="blocks-loading-state">
              Bausteine werden geladen…
            </p>
</div>
</section>
<!-- Abschnitt 2: Annotationen -->
<section class="support-accordion-section" data-accordion="annotations">
<button aria-controls="accordion-body-annotations" aria-expanded="false" class="support-accordion-toggle" type="button">
<span aria-hidden="true" class="support-accordion-icon">🔍</span>
            Annotationen
            <span aria-hidden="true" class="support-accordion-chevron">▾</span>
</button>
<div aria-label="Annotationen" class="support-accordion-body" hidden="" id="accordion-body-annotations" role="region">
<!-- Inhalt wird von annotation_sidebar.js/_refreshAnnotationSidebar() befuellt (Phase 8) -->
<!-- Beleg: Bauplan B6 v0.5 §4.4.2, Projektgespraech 2026-05-06 -->
<p class="support-accordion-empty" id="annotations-loading-state">
              Annotationen werden geladen…
            </p>
</div>
</section>
<!-- Abschnitt 3: Formular (Platzhalter-Eingabe) -->
<section class="support-accordion-section" data-accordion="form">
<button aria-controls="accordion-body-form" aria-expanded="false" class="support-accordion-toggle" type="button">
<span aria-hidden="true" class="support-accordion-icon">📝</span>
            Formular
            <span aria-hidden="true" class="support-accordion-chevron">▾</span>
</button>
<div aria-label="Platzhalter-Formular" class="support-accordion-body" hidden="" id="accordion-body-form" role="region">
<!-- Inhalt wird von placeholder_wizard.js befuellt (Phase 6) -->
<p class="support-accordion-empty">
              Kein Bericht geöffnet.
            </p>
</div>
</section>
<!-- Abschnitt 4: Kommentare (unten) -->
<section class="support-accordion-section" data-accordion="comments">
<button aria-controls="accordion-body-comments" aria-expanded="false" class="support-accordion-toggle" type="button">
<span aria-hidden="true" class="support-accordion-icon">💬</span>
            Kommentare
            <span aria-hidden="true" class="support-accordion-chevron">▾</span>
</button>
<div aria-label="Kommentare" class="support-accordion-body" hidden="" id="accordion-body-comments" role="region">
<!-- Inhalt wird von comment_thread.js befuellt (Phase 4) -->
<p class="support-accordion-empty" id="comments-empty-state">
              Kein Block ausgewählt.
            </p>
<!-- Kommentar-Eingabe (wird von comment_thread.js aktiviert) -->
<textarea aria-label="Neuen Kommentar verfassen" class="comment-input-textarea" placeholder="Kommentar verfassen…" rows="3" style="display:none"></textarea>
</div>
</section>
</aside>
</div>
