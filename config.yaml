server:
  host: "127.0.0.2"
  port: 8080
  mode: "cli"

paths:
  coordinator_db:  "./data/coordinator.db"
  forensic_db_dir: "./data/forensic/"
  default_db:      "./data/default.db"
  evidence_db_dir: "./data/evidence/"
  assets_db_dir:   "./data/assets/"    # NEU Build 017 — assets_<uid>.db liegt hier

hosts_management:
  enabled: false

# Editor-Einstellungen (AP-E4)
# Beleg: AP-E4, Projektgespraech 2026-04-19
editor:
  autosave_debounce_ms: 1500  # Auto-Save-Debounce in ms (Standard: 1500)

logging:
  level: "debug"
  logfile: "./logs/forensic_server.log"
