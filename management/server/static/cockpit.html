<!--
  =============================================================================
  management/server/static/cockpit.html
  IT-Forensisches Ermittlungswerkzeug — Baustelle 7: Cockpit-Shell
  =============================================================================
  Statische Shell des eigenstaendigen Management-Servers. KEINE Inline-Daten:
  Identitaet, Rechte und Sichten werden ausschliesslich per fetch von den
  read-only-JSON-Endpunkten geladen (/api/whoami zuerst). Die policy-getriebene
  Navigation entsteht im Browser (cockpit.js).

  ACHTUNG (Deploy): Diese Datei faellt unter die .gitignore-Regel '*.html' und
  muss daher mit 'git add -f management/server/static/cockpit.html' eingecheckt
  werden. Ohne sie liefert '/' ein 404 (ManagementApp._index serviert sie).

  Build 347: Shell + policy-getriebene Nav.
  Build 348: Overview-Sicht (Tabulator) + SSE-Reload.
  Build 349: Integritaets-/Ops-Sicht + Ketten-Banner + Live-DEBUG.
  Build 350: Backend /api/workload + ECharts-Vendoring.
  Build 351: Lastverteilung-Sicht (cockpit_workload.js) als ECharts-Diagramm.

  Beleg: Bauplan B7 v1.1 §11.1/§11.2.

  Build 360: Kapazitaets-Sicht (cockpit_capacity.js) als ECharts-Diagramm.
  Build 362: Rechte/Policy-Sicht (cockpit_policy.js) als Tabulator-Tabellen.
  Build 364: Persoenliche Sichten (cockpit_mycases.js / cockpit_myhistory.js).
  Build 367: Support-Historie (cockpit_support.js) mit Detail-Mini-Modal.
  Build 369: Ermittler-Betreuung (cockpit_mentoring.js), Live-Sicht.
  Build 371: Statistiken (cockpit_stats.js) mit Reiterstruktur + Downloads.
  Build 373: Zuweisung (cockpit_assignment.js) - erste Schreib-Sicht.
  Build 375: Berichts-Abnahme (cockpit_reports.js).
  Build 378: Berichts-Freigabe (Aktionsfeld, Siegelpruefung).
  Build 380: Rueckgabe zur Nachbesserung.
  Build 384: Fall-Erkennung (cockpit_cases.js) - Abgleich Platte <-> Fallakte
             mit vier Zustaenden, Warnbereich fuer 'vermisst'/'unlesbar' und
             auditierter Aufnahme neu erkannter Faelle (mit Bestaetigung).
  Build 386: Kalender & Wiedervorlage (cockpit_calendar.js) - Monatsraster ueber
             alle Zeitquellen, Faelligkeitsliste externer Vorgaenge, Anlegen /
             Verschieben (Grund Pflicht) / Abschliessen (unwiderruflich).
  Build 395: Ermittlungsergebnis (cockpit_results.js) - Abdeckung je Fall (auch
             die NIE bewerteten) + Verteilung je Kriterium (nie darueber hinweg).
  Build 406: Betreuungs-Notizen (cockpit_notes.js/.css) - Pinboard der Ermittler-
             Betreuung. Karten in Git-Commit-Metapher (Ueberschrift immer
             sichtbar, Rest aufklappbar), Farbe + Tags, Status 'abarbeiten',
             client-seitige Suche/Filter, Archiv-Umschalter, Anlegen/Bearbeiten/
             Duplizieren. Recht: mentoring_notes.view/edit. Drag&Drop in Block 4.
  Version: v0.7.406 · Build: 406 · 2026-07-14
  =============================================================================
-->
