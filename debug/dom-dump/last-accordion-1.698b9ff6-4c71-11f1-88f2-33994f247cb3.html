<section class="support-accordion-section support-accordion-section--open" data-accordion="blocks">
<button aria-controls="accordion-body-blocks" aria-expanded="true" class="support-accordion-toggle" type="button">
<span aria-hidden="true" class="support-accordion-icon">📦</span>
            Bausteine
            <span aria-hidden="true" class="support-accordion-chevron">▾</span>
</button>
<div aria-label="Bausteine" class="support-accordion-body" id="accordion-body-blocks" role="region">
<div class="mp-panel">
<!-- Kategorie-Umschalter -->
<div aria-label="Bausteine-Kategorien" class="mp-cat-tabs" role="tablist">
<button aria-selected="true" class="mp-cat-tab mp-cat-tab--active" data-category="modules" role="tab" type="button">Module</button>
<button aria-selected="false" class="mp-cat-tab" data-category="queries" role="tab" type="button">Einzeldaten</button>
</div>
<!-- Suche -->
<div class="mp-search-wrap">
<span aria-hidden="true" class="mp-search-icon">🔍</span>
<input aria-label="Bausteine durchsuchen" autocomplete="off" class="mp-search-input" id="mp-sidebar-search" placeholder="Suche…" type="search"/>
</div>
<!-- Rollenfilter-Chips (nur im Module-Modus sichtbar) -->
<div aria-label="Rollenfilter" class="mp-role-chips" id="mp-role-chips" role="group" style="">
<button aria-pressed="false" class="mp-chip" data-role="" type="button">Alle</button><button aria-pressed="false" class="mp-chip" data-role="intro" type="button">Einleitung</button><button aria-pressed="false" class="mp-chip" data-role="conclusion" type="button">Fazit</button><button aria-pressed="false" class="mp-chip" data-role="body" type="button">Hauptteil</button><button aria-pressed="false" class="mp-chip" data-role="legal" type="button">Rechtsgrundlagen</button><button aria-pressed="false" class="mp-chip" data-role="appendix" type="button">Anhang</button><button aria-pressed="false" class="mp-chip" data-role="closing" type="button">Abschluss</button><button aria-pressed="true" class="mp-chip mp-chip-active" data-role="standard" type="button">Standard</button>
</div>
<!-- Ergebnisliste -->
<div aria-label="Verfügbare Bausteine" class="mp-list" id="mp-list" role="listbox">
<div class="mp-item mp-item--standard" data-block-type="paragraph" data-std-type="paragraph" draggable="true" role="listitem" tabindex="0" title="Freier Texteintrag (Paragraph)">
<div class="mp-item-header">
<span aria-hidden="true" class="mp-item-icon">✏️</span>
<span class="mp-item-title">¶ Textabsatz</span>
</div>
<div class="mp-item-preview">Freier Texteintrag (Paragraph)</div>
<button aria-label="¶ Textabsatz in Editor einfuegen" class="mp-btn-insert" data-std-type="paragraph" title="¶ Textabsatz einfuegen" type="button">
                + Einfügen
            </button>
</div>
<div class="mp-item mp-item--standard" data-block-type="header" data-std-type="header" draggable="true" role="listitem" tabindex="0" title="Abschnittsüberschrift (H2)">
<div class="mp-item-header">
<span aria-hidden="true" class="mp-item-icon">🆗</span>
<span class="mp-item-title">🆗 Überschrift</span>
</div>
<div class="mp-item-preview">Abschnittsüberschrift (H2)</div>
<button aria-label="🆗 Überschrift in Editor einfuegen" class="mp-btn-insert" data-std-type="header" title="🆗 Überschrift einfuegen" type="button">
                + Einfügen
            </button>
</div>
<div class="mp-item mp-item--standard" data-block-type="list" data-std-type="list" draggable="true" role="listitem" tabindex="0" title="Aufzählungsliste oder nummerierte Liste">
<div class="mp-item-header">
<span aria-hidden="true" class="mp-item-icon">📝</span>
<span class="mp-item-title">📝 Liste</span>
</div>
<div class="mp-item-preview">Aufzählungsliste oder nummerierte Liste</div>
<button aria-label="📝 Liste in Editor einfuegen" class="mp-btn-insert" data-std-type="list" title="📝 Liste einfuegen" type="button">
                + Einfügen
            </button>
</div>
<div class="mp-item mp-item--standard" data-block-type="table" data-std-type="table" draggable="true" role="listitem" tabindex="0" title="Strukturierte Tabelle">
<div class="mp-item-header">
<span aria-hidden="true" class="mp-item-icon">📊</span>
<span class="mp-item-title">📊 Tabelle</span>
</div>
<div class="mp-item-preview">Strukturierte Tabelle</div>
<button aria-label="📊 Tabelle in Editor einfuegen" class="mp-btn-insert" data-std-type="table" title="📊 Tabelle einfuegen" type="button">
                + Einfügen
            </button>
</div>
<div class="mp-item mp-item--standard" data-block-type="quote" data-std-type="quote" draggable="true" role="listitem" tabindex="0" title="Hervorgehobenes Zitat">
<div class="mp-item-header">
<span aria-hidden="true" class="mp-item-icon">„</span>
<span class="mp-item-title">„Zitat“</span>
</div>
<div class="mp-item-preview">Hervorgehobenes Zitat</div>
<button aria-label="„Zitat“ in Editor einfuegen" class="mp-btn-insert" data-std-type="quote" title="„Zitat“ einfuegen" type="button">
                + Einfügen
            </button>
</div>
<div class="mp-item mp-item--standard" data-block-type="delimiter" data-std-type="delimiter" draggable="true" role="listitem" tabindex="0" title="Horizontale Trennlinie">
<div class="mp-item-header">
<span aria-hidden="true" class="mp-item-icon">—</span>
<span class="mp-item-title">— Trennlinie</span>
</div>
<div class="mp-item-preview">Horizontale Trennlinie</div>
<button aria-label="— Trennlinie in Editor einfuegen" class="mp-btn-insert" data-std-type="delimiter" title="— Trennlinie einfuegen" type="button">
                + Einfügen
            </button>
</div>
</div>
<div class="mp-empty" id="mp-empty" style="display:none">
            Keine Einträge gefunden.
        </div>
</div></div>
</section>
